# Builds the miner image on GitHub's runners and pushes it to GitHub Container
# Registry, so no local Docker is needed. Push this folder as the ROOT of its
# own repository (the workflow path must be .github/workflows/ at the root).
#
# Resulting image:  ghcr.io/<github-user>/<repo-name>:latest   (and :sha-xxxxxxx)
# After the first run: GitHub -> your profile -> Packages -> the package ->
# Package settings -> Change visibility -> Public. SaladCloud then pulls it
# without credentials.
name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
